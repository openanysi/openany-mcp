# CONFIRMED authentication header: Authorization: Bearer <OPENANY_API_KEY>.
# Merge into ~/.codex/config.toml. Set OPENANY_API_KEY in the client environment.
[mcp_servers.openany]
url = "https://mcp.openany.si/mcp"
bearer_token_env_var = "OPENANY_API_KEY"

# CLI alternative:
# codex mcp add openany --url https://mcp.openany.si/mcp --bearer-token-env-var OPENANY_API_KEY
