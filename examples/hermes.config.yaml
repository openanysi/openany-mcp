# CONFIRMED authentication header: Authorization: Bearer <OPENANY_API_KEY>.
# Merge into ~/.hermes/config.yaml. Never hardcode a key here.
# Default transport for url entries is Streamable HTTP; do NOT set transport: sse.
# Prefer putting the real key in private ~/.hermes/.env as OPENANY_API_KEY.
# Installable plugin: plugins/openany. This example is not that package.
# Do not merge this block while that plugin is enabled. The name openany
# makes Hermes skip the plugin server. Hermes 0.23.0 also stops tools/list
# on this full /mcp URL after 50 pages. The plugin default is /mcp-lite.
mcp_servers:
  openany:
    url: "https://mcp.openany.si/mcp"
    headers:
      Authorization: "Bearer ${OPENANY_API_KEY}"
