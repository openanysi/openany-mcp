[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "langchain-openany"
version = "0.1.0"
description = "LangChain chat model for the OpenAny Chat Completions API. Unpublished package name, pending registry approval."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Alephant AI LLC", email = "team@openany.si" }]
keywords = ["langchain", "openany", "chat"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "httpx>=0.28.1,<1",
  "langchain-core>=1.8.0,<2",
]

[project.urls]
Homepage = "https://openany.si"
Repository = "https://github.com/openanysi/openany-mcp"
Documentation = "https://openany.si/docs/"
Issues = "https://github.com/openanysi/openany-mcp/issues"

[dependency-groups]
dev = [
  "langchain-tests>=1.1.9,<2",
  "pytest>=9,<10",
]

[tool.hatch.build]
ignore-vcs = true

[tool.hatch.build.targets.wheel]
packages = ["src/langchain_openany"]

[tool.hatch.build.targets.wheel.sources]
"src" = ""

[tool.hatch.build.targets.sdist]
only-include = [
  "src/langchain_openany",
  "examples",
  "README.md",
  "LICENSE",
  "pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_default_fixture_loop_scope = "function"
