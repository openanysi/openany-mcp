name: provider-packages

on:
  pull_request:
  push:
    branches: [main]

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./internal/seo/ ./internal/config/ ./internal/mcpserver/ ./cmd/openany-mcp/ -count=1

  javascript:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: providers/js/openany-ai-sdk-provider
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: npm
          cache-dependency-path: providers/js/openany-ai-sdk-provider/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm pack --dry-run

  dsh-plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
      - run: npm test
      - run: npm pack --dry-run

  pi-package:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugins/pi
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
      - run: npm install --no-save --prefix "$RUNNER_TEMP/pi" @earendil-works/pi-coding-agent@1.6.0
      - run: npm test
        env:
          PI_BIN: ${{ runner.temp }}/pi/node_modules/.bin/pi
      - run: npm pack --dry-run

  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: providers/python/langchain-openany
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --all-groups --frozen
      - run: uv run pytest
      - run: uv build
